experiment:
  name: flower_clustering_comparison
  seeds: [42]
  repetitions: 1
  output_dir: results

datasets:
  - name: iris

# Each value creates a separate benchmark case. The partition is generated
# deterministically and is identical for every algorithm in that case.
partitioning:
  clients: [3]
  modes: [iid]
  dirichlet_alpha: [0.5]

algorithms:
  # Dataset-agnostic generic sane defaults are supplied centrally.
  # Keep this block empty unless the experiment intentionally overrides them.
  - name: kmeans
    params: {}

  - name: dbscan
    params: {}

  - name: fed_kmeans_flower
    params: {}

metrics:
  - ari
  - nmi
  - silhouette
  - davies_bouldin
  - calinski_harabasz
