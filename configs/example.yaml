experiment:
  name: flower_clustering_comparison
  seeds: [42]
  repetitions: 1
  output_dir: results

datasets:
  - name: iris

# Each value creates a separate benchmark case. The partition is generated
# deterministically and is identical for every algorithm in that case.
partitioning:
  clients: [3]
  modes: [iid]
  dirichlet_alpha: [0.5]

algorithms:
  # Common benchmark defaults are supplied centrally: k=oracle-k unless
  # overridden, rounds=10, tol=1e-4, max_iter=300. Keep only truly
  # algorithm-specific parameters here.
  - name: kmeans
    params: {}

  - name: dbscan
    params:
      eps: [0.6]
      min_samples: [5]

  - name: fed_kmeans_flower
    params: {}

metrics:
  - ari
  - nmi
  - silhouette
  - davies_bouldin
  - calinski_harabasz
