[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clustering-flower-eval"
version = "0.1.0"
description = "TimeEval-like benchmark framework for clustering algorithms with Flower-ready adapters"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
flower = ["flwr[simulation]>=1.20,<2.0"]

[project.scripts]
clustereval = "clustering_eval.cli:main"

[tool.setuptools.packages.find]
include = ["clustering_eval*"]
